name: blue_bird_scanner
description: A Flutter plugin for barcode scanning with BlueBird PDAs.
version: 5.0.0
homepage: https://github.com/luis901101/blue_bird_scanner
issue_tracker: https://github.com/luis901101/blue_bird_scanner/issues
topics:
  - barcode
  - qrcode
  - scanner
  - bluebird

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: '>=1.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: com.plugin.flutter.bluebirdscanner
        pluginClass: BlueBirdScannerPlugin
